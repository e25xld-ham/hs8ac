name: Update HS8AC links

on:
  push:
    paths:
      - '.github/workflows/update-hs8ac-links.yml'

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Update production links in source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s2 = s.replace('https://e25xld-ham.github.io/dvswitch-manual/register.html', 'https://hs8ac.com/asl/register')
          s2 = s2.replace('https://e25xld-ham.github.io/dvswitch-manual/index.html', 'https://hs8ac.com/asl/manual')
          if s2 == s:
              print('No changes needed')
          else:
              p.write_text(s2)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update ASL registration and manual links'
          git push origin master
